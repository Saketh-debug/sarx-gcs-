# /etc/mavlink-router/main.conf  (copy this file there on the Pi)
#
# Bridges the Cube Orange+ (USB), the air ESP32 (UART), and the local autonomy
# script. The autonomy daemon connects to the UdpEndpoint below (14552).

[General]
ReportStats = false
MavlinkDialect = ardupilotmega

# --- Cube Orange+ over USB CDC ACM -----------------------------------------
# Confirm the exact device with: ls -l /dev/serial/by-id/usb-ArduPilot_CubeOrangePlus*
[UartEndpoint cube]
Device = /dev/serial/by-id/usb-ArduPilot_CubeOrangePlus_XXXXXXXXXXXX-if00
Baud = 921600

# --- Air ESP32 (ESP-NOW bridge) over a Pi UART ------------------------------
# On a Pi 5, the primary UART is typically /dev/ttyAMA0 (enable in raspi-config).
[UartEndpoint air_esp32]
Device = /dev/ttyAMA0
Baud = 115200

# --- Local autonomy daemon --------------------------------------------------
[UdpEndpoint local_autonomy]
Mode = Normal
Address = 127.0.0.1
Port = 14552
